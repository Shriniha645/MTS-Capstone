<div class="card-container">
  <mat-card class="login-card glass-card">
    <mat-card-header class="text-center d-block pt-4 mb-3">
      <mat-card-title class="login-title justify-content-center fw-bold mb-1" style="color: #720d3f;">
        <mat-icon class="title-icon me-2" style="color: #720d3f;">account_balance</mat-icon>
        <span>Make quick transactions</span>
      </mat-card-title>
      <mat-card-subtitle style="color: #720d3f; opacity: 0.7;">Sign in to your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="px-4 pb-4">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="d-flex flex-column">
        
        <mat-form-field class="glass-input mb-2" appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" placeholder="Username" autocomplete="username" />
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="username?.hasError('required')">Required</mat-error>
          <mat-error *ngIf="username?.hasError('minlength')">Too short</mat-error>
        </mat-form-field>

        <mat-form-field class="glass-input mb-3" appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Password" autocomplete="current-password" />
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()" class="opacity-75">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="password?.hasError('required')">Required</mat-error>
        </mat-form-field>

        <div class="glass-error d-flex align-items-center p-3 rounded-3 mb-3" *ngIf="errorMessage">
          <mat-icon class="me-2 small">error</mat-icon>
          <span class="small fw-medium">{{ errorMessage }}</span>
        </div>

        <button mat-flat-button class="btn-glow py-4 mt-1" type="submit" [disabled]="isLoading">
          <mat-spinner *ngIf="isLoading" diameter="20" class="me-2 d-inline-block"></mat-spinner>
          <span *ngIf="!isLoading">SIGN IN</span>
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
