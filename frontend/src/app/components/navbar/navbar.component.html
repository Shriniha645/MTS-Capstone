<mat-toolbar class="navbar">
  <div class="navbar-container">
    <!-- Logo/Brand -->
    <div class="navbar-brand" (click)="navigateToHome()">
      <mat-icon class="brand-icon">account_balance</mat-icon>
      <span class="brand-name">Transfer Anytime Anywhere . .</span>
    </div>

    <!-- Navigation Links -->
    <div class="navbar-links">
      <!-- Show these links only when authenticated -->
      <ng-container *ngIf="isAuthenticated">
        <button mat-button routerLink="/dashboard" routerLinkActive="active">
          <mat-icon>dashboard</mat-icon>
          <span class="nav-text">Dashboard</span>
        </button>
        <button mat-button routerLink="/transfer" routerLinkActive="active">
          <mat-icon>send</mat-icon>
          <span class="nav-text">Transfer</span>
        </button>
        <button mat-button routerLink="/history" routerLinkActive="active">
          <mat-icon>history</mat-icon>
          <span class="nav-text">History</span>
        </button>
        <button mat-button routerLink="/rewards" routerLinkActive="active">
          <mat-icon>star</mat-icon>
          <span class="nav-text">Rewards</span>
        </button>
      </ng-container>
    </div>

    <!-- User Actions -->
    <div class="navbar-actions">
      <!-- Show Login button when not authenticated -->
      <ng-container *ngIf="!isAuthenticated">
        <button mat-flat-button class="btn-login" routerLink="/login">
          <mat-icon>login</mat-icon>
          <span class="ms-1">Login</span>
        </button>
      </ng-container>

      <!-- Show user menu when authenticated -->
      <ng-container *ngIf="isAuthenticated">
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
          <mat-icon>account_circle</mat-icon>
          <span class="user-name">{{ username }}</span>
          <mat-icon>arrow_drop_down</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu" class="user-menu">
          <button mat-menu-item routerLink="/dashboard">
            <mat-icon>dashboard</mat-icon>
            <span>Dashboard</span>
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </ng-container>
    </div>
  </div>
</mat-toolbar>
